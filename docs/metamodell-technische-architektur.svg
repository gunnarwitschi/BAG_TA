<text x="460" y="585" text-anchor="middle" class="lab">verwendet · TEMPORÄR</text>
<text x="460" y="604" text-anchor="middle" class="small">wenn HPV noch unbekannt</text>

<path d="M340 485 C500 540 760 575 920 575 C1050 575 1130 575 1190 610" class="rel"/>
<text x="760" y="560" text-anchor="middle" class="lab">verwendet · FINAL</text>
