<!-- Legend -->
<rect x="55" y="820" width="640" height="125" rx="8" fill="#f7f8fa" stroke="#c8ced8"/>
<text x="78" y="850" class="head">Legende</text>
<path d="M80 880 L155 880" class="rel"/><text x="175" y="886" class="txt">Permanente Beziehung</text>
<path d="M80 910 L155 910" class="temp"/><text x="175" y="916" class="txt">Temporäre Beziehung: Version noch unbekannt</text>
<text x="78" y="938" class="small">Temporär = FA → T bzw. FA → HP · Final = FA → TV bzw. FA → HPV</text>

<!-- Rules -->
<rect x="720" y="820" width="680" height="125" rx="8" fill="#f7f8fa" stroke="#c8ced8"/>
<text x="743" y="850" class="head">Modellierungsregeln</text>
<text x="743" y="877" class="txt">1. FA verwendet primär die konkrete Version: FA → TV bzw. FA → HPV.</text>
<text x="743" y="901" class="txt">2. Ist die Version unbekannt, ist vorübergehend FA → T bzw. FA → HP zulässig.</text>
<text x="743" y="925" class="txt">3. Sobald die Version bekannt ist, wird die temporäre Beziehung auf TV bzw. HPV umgestellt.</text>
<text x="743" y="949" class="txt">4. TG gruppiert T und ist fachanwendungsunabhängig; TG ist kein Zwischenobjekt für FA-Zuordnungen.</text>
</svg>