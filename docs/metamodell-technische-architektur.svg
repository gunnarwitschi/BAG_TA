<text x="55" y="800" class="head">Modellierungsregeln</text>
<text x="55" y="830" class="txt">1. FA verwendet direkt TV bzw. HPV, wenn die konkrete Version bekannt ist.</text>
<text x="55" y="855" class="txt">2. Ist die Version unbekannt, darf vorübergehend FA → T bzw. FA → HP verwendet werden.</text>
<text x="55" y="880" class="txt">3. Nach Ermittlung der Version wird die temporäre Beziehung auf TV bzw. HPV umgehängt.</text>
<text x="55" y="905" class="txt">4. Für dieselbe Verwendung bestehen nicht gleichzeitig FA → T und FA → TV bzw. FA → HP und FA → HPV.</text>
<text x="55" y="930" class="txt">5. TG gruppiert T; T gehört über seine Versionen zu TV. TG ist fachanwendungsunabhängig.</text>
