<path d="M785 275 L860 275" class="rel"/>
<text x="822" y="258" text-anchor="middle" class="lab">gruppiert</text>
<path d="M1105 275 L1180 275" class="rel"/>
<text x="1142" y="258" text-anchor="middle" class="lab">hat Version</text>

<!-- FA technology relations -->
<path d="M340 350 C400 350 420 275 500 275" class="temp"/>
<text x="410" y="318" text-anchor="middle" class="lab">verwendet · TEMPORÄR</text>
<text x="410" y="337" text-anchor="middle" class="small">wenn TV noch unbekannt</text>

<path d="M340 410 C430 410 445 450 540 450 C800 450 1080 450 1270 360" class="rel"/>
<text x="805" y="439" text-anchor="middle" class="lab">verwendet · FINAL</text>
<text x="805" y="458" text-anchor="middle" class="small">FA → TV, sobald konkrete Version bekannt</text>

