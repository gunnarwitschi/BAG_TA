<rect x="500" y="535" width="900" height="250" rx="12" fill="#fff9ef" stroke="#e7b76b" stroke-width="1.5"/>
<text x="950" y="565" text-anchor="middle" class="head">Herstellerprodukte</text>

<!-- HP -->
<rect x="650" y="610" width="280" height="145" rx="8" fill="#ffe5cc" stroke="#394150"/>
<rect x="650" y="610" width="280" height="52" rx="8" fill="#ffd0a6" stroke="#394150"/>
